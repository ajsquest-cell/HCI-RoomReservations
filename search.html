<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Room Search: Time/Location</title>
    </head>
    <body>
        <p id="message"></p>

        <button onclick="toggle('time-section')">Search for available locations by time</button>
        <div id="time-section" hidden>
            <label>Start time <input id="start" type="number" min="9" max="16"></label>
            <label>End time <input id="end" type="number" min="10" max="17"></label>
            <button onclick="searchByTime()">Search</button>
            <div id="time-results"></div>
        </div>

    <br><br>

    <button onclick="toggle('building-section')">Search for available locations by building</button>
        <div id="building-section" hidden>
            <label>Building <select id="building"></select></label>
            <button onclick="searchByBuilding()">Search</button>
            <div id="building-results"></div>
        </div>

        <script src="search.js"></script>
    </body>
</html>
